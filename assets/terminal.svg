<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="15">
  <!-- Animación en bucle de 14 s: whoami → neofetch → cursor. Todo con SMIL, compatible con <img> en GitHub. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d160d"/>
      <stop offset="1" stop-color="#040704"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#39ff14" opacity="0.035"/>
    </pattern>
    <clipPath id="c1"><rect x="36" y="56" height="24" width="0">
      <animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.0214;0.0714;0.96;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="36" y="114" height="24" width="0">
      <animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.1429;0.1929;0.96;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- ventana -->
  <rect width="900" height="460" rx="14" fill="url(#bg)" stroke="#1f5f1f" stroke-width="1.5"/>
  <path d="M14 0H886A14 14 0 0 1 900 14V36H0V14A14 14 0 0 1 14 0Z" fill="#0f1f0f"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" fill="#5f9f5f" font-size="13" text-anchor="middle">michael@santa-marta: ~ — zsh</text>

  <g filter="url(#glow)" xml:space="preserve" style="white-space:pre">
    <!-- whoami -->
    <g clip-path="url(#c1)"><text x="40" y="74" fill="#39ff14"><tspan fill="#7fff7f">❯</tspan> whoami</text></g>
    <text x="40" y="100" fill="#e6ffe6" opacity="0">Michael Martínez De La Hoz<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0929;0.0964;0.96;1" dur="14s" repeatCount="indefinite"/></text>

    <!-- neofetch -->
    <g clip-path="url(#c2)"><text x="40" y="132" fill="#39ff14"><tspan fill="#7fff7f">❯</tspan> neofetch</text></g>

    <g fill="#39ff14" font-weight="700" font-size="17" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2143;0.2178;0.96;1" dur="14s" repeatCount="indefinite"/>
      <text x="40" y="180">&#160;&#160;__&#160;&#160;__&#160;__&#160;&#160;__&#160;</text>
      <text x="40" y="200">&#160;|&#160;&#160;\/&#160;&#160;|&#160;&#160;\/&#160;&#160;|</text>
      <text x="40" y="220">&#160;|&#160;|\/|&#160;|&#160;|\/|&#160;|</text>
      <text x="40" y="240">&#160;|&#160;|&#160;&#160;|&#160;|&#160;|&#160;&#160;|&#160;|</text>
      <text x="40" y="260">&#160;|_|&#160;&#160;|_|_|&#160;&#160;|_|</text>
      <text x="40" y="300" font-weight="400" font-size="12" fill="#5f9f5f">&#160;&#160;[&#160;FULLSTACK&#160;]</text>
    </g>

    <g font-size="14.5">
      <text x="280" y="166" opacity="0"><tspan fill="#39ff14" font-weight="700">michael</tspan><tspan fill="#e6ffe6">@</tspan><tspan fill="#39ff14" font-weight="700">santa-marta</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2143;0.2178;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="186" fill="#2f7f2f" opacity="0">───────────────────<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.225;0.2285;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="210" opacity="0"><tspan fill="#7fff7f" font-weight="700">Rol      </tspan><tspan x="372" fill="#e6ffe6">FullStack Developer</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2357;0.2392;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="232" opacity="0"><tspan fill="#7fff7f" font-weight="700">Host     </tspan><tspan x="372" fill="#e6ffe6">Santa Marta, Colombia</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2464;0.2499;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="254" opacity="0"><tspan fill="#7fff7f" font-weight="700">Kernel   </tspan><tspan x="372" fill="#e6ffe6">Ing. de Sistemas · Universidad del Magdalena</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2571;0.2606;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="276" opacity="0"><tspan fill="#7fff7f" font-weight="700">Frontend </tspan><tspan x="372" fill="#e6ffe6">Vue · React · Angular · TypeScript</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2679;0.2714;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="298" opacity="0"><tspan fill="#7fff7f" font-weight="700">Backend  </tspan><tspan x="372" fill="#e6ffe6">Laravel · Node.js · NestJS · Spring Boot</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2786;0.2821;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="320" opacity="0"><tspan fill="#7fff7f" font-weight="700">Database </tspan><tspan x="372" fill="#e6ffe6">MySQL · PostgreSQL · MongoDB · SQLite</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2893;0.2928;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="342" opacity="0"><tspan fill="#7fff7f" font-weight="700">DevOps   </tspan><tspan x="372" fill="#e6ffe6">Docker · AWS · Git · GitHub</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.3035;0.96;1" dur="14s" repeatCount="indefinite"/></text>
      <text x="280" y="364" opacity="0"><tspan fill="#7fff7f" font-weight="700">Status   </tspan><tspan x="372" fill="#39ff14">● ONLINE</tspan><tspan fill="#e6ffe6"> — abierto a colaborar</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3107;0.3142;0.96;1" dur="14s" repeatCount="indefinite"/></text>
    </g>

    <!-- bloques de color estilo neofetch -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3214;0.3249;0.96;1" dur="14s" repeatCount="indefinite"/>
      <rect x="280" y="378" width="26" height="14" fill="#0a0f0a" stroke="#1f5f1f"/>
      <rect x="306" y="378" width="26" height="14" fill="#ff5f56"/>
      <rect x="332" y="378" width="26" height="14" fill="#39ff14"/>
      <rect x="358" y="378" width="26" height="14" fill="#ffbd2e"/>
      <rect x="384" y="378" width="26" height="14" fill="#00b7ff"/>
      <rect x="410" y="378" width="26" height="14" fill="#c86bff"/>
      <rect x="436" y="378" width="26" height="14" fill="#00f0d0"/>
      <rect x="462" y="378" width="26" height="14" fill="#e6ffe6"/>
    </g>

    <!-- prompt final con cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.3535;0.96;1" dur="14s" repeatCount="indefinite"/>
      <text x="40" y="430" fill="#7fff7f">❯</text>
      <rect x="58" y="416" width="10" height="18" fill="#39ff14">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- efecto CRT -->
  <rect width="900" height="460" rx="14" fill="url(#scan)"/>
  <rect x="0" y="-80" width="900" height="80" fill="#39ff14" opacity="0.035">
    <animate attributeName="y" from="-80" to="460" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
